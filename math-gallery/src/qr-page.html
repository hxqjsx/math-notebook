<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1e8;color:#173f35;font-family:"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:600px;margin:auto;padding:32px 24px 48px}.eyebrow{font-size:12px;color:#68736b;letter-spacing:.12em}h1{font:500 28px/1.4 "Songti SC","STSong",serif;margin:12px 0}header p{font-size:13px;color:#68736b;line-height:1.8;margin:0 0 24px}.qr-card{padding:22px 18px;background:#fff;border:1px solid #d9dfd4;border-radius:8px}.qr-card img{display:block;width:100%;max-width:360px;height:auto;margin:auto}@media(max-width:700px){main{padding:24px 18px 36px}h1{font-size:25px}.qr-card{padding:18px 14px}}
</style>
</head>
<body><main>
<header><h1>{{TITLE}}</h1><p>{{INSTRUCTION}}</p></header>
<section class="qr-card"><img src="{{IMAGE}}" alt="{{ALT}}" width="{{WIDTH}}" height="{{HEIGHT}}"></section>
</main></body></html>
